<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F4F4F0" />
    <meta name="description" content="Operations dashboard for Whitcombe &amp; Rudd, a fictional heating, cooling and appliance service firm. Concept project by flouHAN Software." />
    <meta name="robots" content="noindex" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <title>Whitcombe &amp; Rudd · Operations</title>
    <script>
      // Tema sayfa çizilmeden ayarlanır; açılışta yanlış renk görünmesin
      try {
        var q = new URLSearchParams(location.search);
        var p = JSON.parse(localStorage.getItem('wr-prefs') || '{}');
        var th = q.get('theme') || p.theme;
        document.documentElement.dataset.theme = th === 'dark' ? 'dark' : 'light';
        if ((q.get('lang') || p.lang) === 'tr') document.documentElement.lang = 'tr';
      } catch (e) {
        document.documentElement.dataset.theme = 'light';
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
